name: Daily Quant Stock Finder

on:
  schedule:
    # Runs Monday through Friday at 10:30 AM UTC (4:00 PM IST)
    # This is after the Indian stock market closes, so you have fresh picks for the next session!
    - cron: '30 10 * * 1-5'
  workflow_dispatch: # Allows you to manually run the scan anytime you want

jobs:
  run-scanner:
    runs-on: ubuntu-latest

    permissions:
      contents: write # Allows the workflow to push the updated index.html back to your repository

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v3

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'
        cache: 'pip'

    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Run Daily Stock Scanner
      run: python update_web_dashboard.py

    - name: Commit and Push Updated Dashboard
      run: |
        git config --global user.name "GitHub Actions Bot"
        git config --global user.email "actions@github.com"
        git add index.html
        git commit -m "Automated update: $(date +'%Y-%m-%d %H:%M:%S IST')" || echo "No changes to commit"
        git push
